<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EA FC26 Countdown</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #f0f0f0;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
    }
    #countdown {
      font-size: 2.5em;
      font-weight: bold;
      margin-top: 0.5em;
      color: #4caf50;
    }
    #disclaimer {
      font-size: 0.9em;
      color: #bbb;
      margin-top: 3em;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    img {
      max-width: 150px;
      margin-top: 1em;
    }
  </style>
</head>
<body>

  <h1>Days Until EA FC26:</h1>
  <div id="countdown">Loading...</div>
  
  <img src="{{ url_for('static', filename='ea_fc26_logo.png') }}" alt="EA FC26 Logo" />
  
  <div id="disclaimer">
    This site is in no way affiliated with EA or its affiliates. It provides an estimated countdown based on past historical release dates.
  </div>

  <script>
    const countdownEl = document.getElementById('countdown');
    // Set target date/time (UTC)
    const targetDate = new Date('September 26, 2025 00:00:00 UTC');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownEl.textContent = "The wait is over!";
        clearInterval(timerId);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    const timerId = setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
